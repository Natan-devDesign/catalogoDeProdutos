<svg width="100%" viewBox="0 0 680 1580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Mapa de Infraestrutura — BRIWAX</title>
  <desc>Fluxograma completo da infraestrutura: Browser, Rotas, Middlewares, Controllers, Models, PostgreSQL, Views EJS e fluxos de acesso público e admin.</desc>
  <style>
